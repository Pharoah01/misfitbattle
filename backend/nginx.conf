# Misfits Battle - Nginx Configuration
# Serves frontend (React SPA) + proxies API to Gunicorn
# Domain: binarymisfits.info / api.binarymisfits.info
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/misfits-battle
#   sudo ln -s /etc/nginx/sites-available/misfits-battle /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx
#
# Frontend build:
#   cd /opt/misfitbattle/frontend && npm run build
#   Output: /opt/misfitbattle/frontend/dist/

upstream gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# --- Main site: serves frontend + API ---
server {
    listen 80;
    server_name binarymisfits.info www.binarymisfits.info;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/misfits-access.log;
    error_log /var/log/nginx/misfits-error.log;

    # --- API routes → Gunicorn ---
    location /api/ {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --- Django Admin → Gunicorn ---
    location /admin/ {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Django static files (admin CSS/JS) ---
    location /static/ {
        alias /opt/misfitbattle/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Media uploads ---
    location /media/ {
        alias /opt/misfitbattle/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Frontend static assets (JS/CSS/fonts with hashes) ---
    location /assets/ {
        alias /opt/misfitbattle/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Frontend SPA (all other routes → index.html) ---
    location / {
        root /opt/misfitbattle/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# --- API subdomain (keep for backwards compat) ---
server {
    listen 80;
    server_name api.binarymisfits.info;

    client_max_body_size 10M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/misfits-api-access.log;
    error_log /var/log/nginx/misfits-api-error.log;

    location /static/ {
        alias /opt/misfitbattle/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /opt/misfitbattle/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
