# Misfits Battle Backend - Nginx Configuration
# Domain: api.binarymisfits.info
# 
# Installation:
# sudo cp nginx.conf /etc/nginx/sites-available/misfits-battle
# sudo ln -s /etc/nginx/sites-available/misfits-battle /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl restart nginx

upstream gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name api.binarymisfits.info;

    client_max_body_size 10M;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/misfits-access.log;
    error_log /var/log/nginx/misfits-error.log;

    # Static files
    location /static/ {
        alias /opt/misfits/MisfitsBattle/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /opt/misfits/MisfitsBattle/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
