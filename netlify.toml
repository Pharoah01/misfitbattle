# Netlify Configuration for Misfits-Battle Frontend
# React + Vite + TypeScript SPA
# 
# This file is for deploying the ENTIRE REPOSITORY to Netlify
# If you're only deploying the frontend folder, use frontend/netlify.toml instead

[build]
  # Build command
  command = "npm run build"
  
  # Output directory (Vite default)
  publish = "frontend/dist"
  
  # Base directory for build
  base = "frontend"

[build.environment]
  # Node version
  NODE_VERSION = "18"
  
  # NPM version (optional)
  NPM_VERSION = "9"

# SPA redirect rule - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy (adjust based on your needs)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com blob: data:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: http:;
      connect-src 'self' http://localhost:8000 https://api.binarymisfits.info https://65.0.92.164 https://cloudflareinsights.com;
      frame-src 'self';
      worker-src 'self' blob: data:;
      child-src 'self' blob: data:;
    """
    
    # Permissions Policy
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://misfits-battle.netlify.app/*"
  to = "https://misfits-battle.netlify.app/:splat"
  status = 301
  force = true

# Optional: Custom domain redirects (uncomment and configure if needed)
# [[redirects]]
#   from = "http://yourdomain.com/*"
#   to = "https://yourdomain.com/:splat"
#   status = 301
#   force = true

# Optional: Redirect www to non-www (or vice versa)
# [[redirects]]
#   from = "https://www.yourdomain.com/*"
#   to = "https://yourdomain.com/:splat"
#   status = 301
#   force = true

# Plugin configuration (optional)
# [[plugins]]
#   package = "@netlify/plugin-lighthouse"

# Context-specific settings
[context.production]
  command = "npm run build"
  
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_URL = "https://api.binarymisfits.info"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Development context (for branch deploys)
[context.dev]
  command = "npm run build"
  
[context.dev.environment]
  NODE_ENV = "development"
